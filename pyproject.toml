[project]
name = "pm-manager-cli"
version = "0.0.4"
description = "PM Manager CLI — bootstrap local .pm project governance for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pm-manager contributors" }]
keywords = ["pm", "governance", "ai-agent", "cursor", "claude", "spec-kit"]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/wei63w/pm-manager"
Repository = "https://github.com/wei63w/pm-manager"
Issues = "https://github.com/wei63w/pm-manager/issues"

[project.scripts]
pm = "pm_manager_cli.cli:app"
pm-manager = "pm_manager_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_manager_cli"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "pm_manager_cli/pack/templates"
"adapters" = "pm_manager_cli/pack/adapters"
"memory" = "pm_manager_cli/pack/memory"
"SKILL.md" = "pm_manager_cli/pack/SKILL.md"
"AGENTS.md" = "pm_manager_cli/pack/AGENTS.md"
"scripts/python/create_pm_scaffold.py" = "pm_manager_cli/pack/scripts/python/create_pm_scaffold.py"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]
